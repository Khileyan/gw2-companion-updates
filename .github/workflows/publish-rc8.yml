name: Validate and publish GW2 Companion RC8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc8.yml'
      - '.github/rc8-overlay/**'

permissions:
  contents: write

concurrency:
  group: gw2-rc8-publish
  cancel-in-progress: false

jobs:
  rc8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch and verify exact published RC7 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work dist
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/Khileyan/gw2-companion-updates/releases/download/v5.9.0-rc.7/GW2-Account-Companion-v5.9.0-rc.7-All-in-One.zip' -o work/rc7.zip
          echo 'c1271f6f1d7c008d5c72df6cfea7769536e4779f71e05d289a8fa0218581d642  work/rc7.zip' | sha256sum -c -
          (cd work && unzip -q rc7.zip && mv GW2-Account-Companion-v5.9.0-rc.7 source)
      - name: Apply reviewed RC8 overlay and enforce exact digest
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/rc8-overlay/patch.gz.b64 > work/rc8.patch.gz
          echo '2c95528757b6640e0a170990c4bfe07fd3e37f234ee570c3ec41649f4d5f8a42  work/rc8.patch.gz' | sha256sum -c -
          gzip -dc work/rc8.patch.gz > work/rc8.patch
          echo '2c95528757b6640e0a170990c4bfe07fd3e37f234ee570c3ec41649f4d5f8a42  work/rc8.patch' | sha256sum -c -
          (cd work/source && git init -q && git apply --check ../rc8.patch && git apply ../rc8.patch)
          grep -F '"version": "5.9.0-rc.8"' work/source/app/package.json
          grep -F '"version": "5.9.0-rc.8"' work/source/app-version.json
          grep -F "export const VERSION = '5.9.0-rc.8'" work/source/app/engine.mjs
          grep -F "VERSION='5.9.0-rc.7'" work/source/tools/build-release.py
          sed -i "s/VERSION='5.9.0-rc.7'/VERSION='5.9.0-rc.8'/" work/source/tools/build-release.py
      - name: Run full RC7+RC8 regression suite
        shell: bash
        run: |
          set -euo pipefail
          (cd work/source && node --test tests/*.test.mjs)
      - name: Verify all JS syntax and package reproducibility
        shell: bash
        run: |
          set -euo pipefail
          find work/source/app work/source/bootstrap -type f -name '*.mjs' -print0 | xargs -0 -n 1 node --check
          python3 work/source/tools/build-release.py dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip
          python3 work/source/tools/build-release.py dist/GW2-Account-Companion-v5.9.0-rc.8-independent.zip
          cmp dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip dist/GW2-Account-Companion-v5.9.0-rc.8-independent.zip
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {inspectReleaseZip} from './work/source/app/install-verified.mjs';
          const zip=fs.readFileSync('dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip');
          const records=inspectReleaseZip(zip,{version:'5.9.0-rc.8'}).records;
          if(!records.some(r=>r.parts.at(-1)==='publish-release.mjs'))throw Error('RC8 publisher missing from build');
          if(!records.some(r=>r.parts.at(-1)==='GW2-Companion.ps1'))throw Error('RC8 GUI missing');
          console.log('Verified RC8 release:',records.length,'entries');
          JS
          sha256sum dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip
      - name: Retain reviewed build as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gw2-companion-rc8-preflight
          path: dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip
          if-no-files-found: error
      - name: Check whether owner-authorized signing is configured
        id: signing
        shell: bash
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.GW2_ED25519_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY_BASE64" ]; then
            echo 'Not publishing: no owner-authorized signing key is configured.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Sign and publish with independently pinned key
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.GW2_ED25519_SIGNING_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/publisher-private.pem"' EXIT
          umask 077
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/publisher-private.pem"
          mkdir -p work/source/config
          cp .github/rc8-overlay/publisher-public.pem work/source/config/publisher-public.pem
          cat > work/source/config/update-source.json <<'JSON'
          {"schema":1,"channel":"preview","manifest_url":"https://raw.githubusercontent.com/Khileyan/gw2-companion-updates/main/preview.json","publisher_fingerprint_sha256":"84797eaaf61d8f757ecfc6f65a5cbe6dc7952063fd970bcb2a745aca8cb6f045"}
          JSON
          node work/source/app/publish-release.mjs \
            dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip \
            "$RUNNER_TEMP/publisher-private.pem"
# CI never generates a replacement trust key. If the owner-approved key is absent,
# builds are tested and retained, but no signed feed or new release is published.
