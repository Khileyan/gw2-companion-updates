name: Publish RC7 fixed-path connection fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc7.yml'

permissions:
  contents: write

concurrency:
  group: gw2-rc7-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public update repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and authenticate previously published RC6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work dist
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/Khileyan/gw2-companion-updates/releases/download/v5.9.0-rc.6/GW2-Account-Companion-v5.9.0-rc.6-All-in-One.zip' -o work/base.zip
          echo '770bc6c77eadaba41665f56ea8f0d1f2c029c60cba2f4beff146a8dd3b43afaa  work/base.zip' | sha256sum -c -
      - name: Apply pinned RC7 patch to isolated source
        shell: bash
        run: |
          set -euo pipefail
          (cd work && unzip -q base.zip && mv GW2-Account-Companion-v5.9.0-rc.6 source)
          cat .github/rc7-overlay/patch.gz.b64 | base64 -d > work/patch.gz
          echo 'cea6b4d370f603935a08fc7e0038dd919a49ebd8eaa52a591ed2dcc0cd2df58d  work/patch.gz' | sha256sum -c -
          gzip -dc work/patch.gz > work/patch.diff
          (cd work/source && git init -q && git apply --check ../patch.diff && git apply ../patch.diff)
          grep -F "VERSION='5.9.0-rc.7'" work/source/tools/build-release.py
          grep -F '"version": "5.9.0-rc.7"' work/source/app/package.json
          grep -F '$script:FixedCleanupTriggered=$false' work/source/launcher/GW2-Companion.ps1
      - name: Full Node.js test suite including RC7 strict-mode regression
        shell: bash
        run: |
          set -euo pipefail
          (cd work/source && node --test tests/*.test.mjs)
      - name: Build deterministic ZIP and enforce reviewed digest
        shell: bash
        run: |
          set -euo pipefail
          python3 work/source/tools/build-release.py dist/GW2-Account-Companion-v5.9.0-rc.7-All-in-One.zip
          echo 'c1271f6f1d7c008d5c72df6cfea7769536e4779f71e05d289a8fa0218581d642  dist/GW2-Account-Companion-v5.9.0-rc.7-All-in-One.zip' | sha256sum -c -
      - name: Publish RC7 pre-release; never overwrite an existing tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v5.9.0-rc.7 >/dev/null 2>&1; then
            echo 'RC7 already exists; refusing to overwrite published release.' >&2
            exit 1
          fi
          gh release create v5.9.0-rc.7 \
            dist/GW2-Account-Companion-v5.9.0-rc.7-All-in-One.zip \
            --title 'GW2 Companion 5.9.0-rc.7 (Connection Fix)' \
            --notes-file work/source/CHANGELOG-v5.9.0-rc.7.md \
            --prerelease \
            --target "$GITHUB_SHA"

# Owner-only Ed25519 private signing key is NEVER loaded by this workflow.
# The owner must sign and approve preview.json from their Windows PC afterward.