name: RC10 signed release after complete Windows regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc10.yml'

permissions:
  contents: read

concurrency:
  group: gw2-rc10-release
  cancel-in-progress: false

jobs:
  full-gate:
    uses: ./.github/workflows/rc10-candidate.yml
    permissions:
      contents: read

  publish:
    needs: full-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rc10-candidate-source
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rc10-candidate-unpublished
          path: dist
      - name: Verify immutable release and exact RC10 ZIP before signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v5.9.0-rc.10 --repo Khileyan/gw2-companion-updates >/dev/null 2>&1; then
            echo 'Immutable RC10 tag exists; refusing to overwrite.' >&2
            exit 1
          fi
          mv dist/rc10-candidate.zip dist/GW2-Account-Companion-v5.9.0-rc.10-All-in-One.zip
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {inspectReleaseZip} from './source/app/install-verified.mjs';
          inspectReleaseZip(fs.readFileSync('dist/GW2-Account-Companion-v5.9.0-rc.10-All-in-One.zip'),{version:'5.9.0-rc.10'});
          JS
          sha256sum dist/GW2-Account-Companion-v5.9.0-rc.10-All-in-One.zip
      - name: Sign and publish using the existing pinned owner publisher key
        shell: bash
        env:
          PRIVATE_KEY_PEM: ${{ secrets.GW2_ED25519_SIGNING_KEY_PEM }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_KEY_PEM" ]; then echo 'Missing owner signing key'; exit 1; fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/publisher-private.pem"' EXIT
          printf '%s\n' "$PRIVATE_KEY_PEM" > "$RUNNER_TEMP/publisher-private.pem"
          mkdir -p source/config
          cp .github/rc8-overlay/publisher-public.pem source/config/publisher-public.pem
          cat > source/config/update-source.json <<'JSON'
          {"schema":1,"channel":"preview","manifest_url":"https://raw.githubusercontent.com/Khileyan/gw2-companion-updates/main/preview.json","publisher_fingerprint_sha256":"84797eaaf61d8f757ecfc6f65a5cbe6dc7952063fd970bcb2a745aca8cb6f045"}
          JSON
          node source/app/publish-release.mjs \
            dist/GW2-Account-Companion-v5.9.0-rc.10-All-in-One.zip \
            "$RUNNER_TEMP/publisher-private.pem"

# Never bypass full-gate. Production preview.json changes only in the signed publisher.
