name: RC9 preflight - exact RC8.3 upgrade candidate (no publication)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc9-preflight.yml'

permissions:
  contents: read

concurrency:
  group: gw2-rc9-preflight
  cancel-in-progress: false

jobs:
  verify-base:
    uses: ./.github/workflows/test-rollback-safety.yml
    permissions:
      contents: read

  prepare:
    needs: verify-base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch precisely reviewed RC8 source from verified rollback workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-rollback-source
          path: work/source
      - name: Rebuild and SHA-verify published RC8.3 before modifying it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 .github/rc83-patch.py work/source
          cp .github/rc83-handoff.test.mjs work/source/tests/rc83-handoff.test.mjs
          python3 work/source/tools/build-release.py dist/verified-rc83.zip
          echo 'ef27fc3a018227ac2e7377fcddb1ac8f3f6d9ddba3f991feadd4bb8cfab0cc65  dist/verified-rc83.zip' | sha256sum -c -
      - name: Apply strictly scoped RC9 launcher change
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/rc9-patch.py work/source
          node --input-type=module <<'JS'
          import {compareVersions} from './work/source/app/updater.mjs';
          if(compareVersions('5.9.0-rc.9','5.9.0-rc.8.3')!==1)throw Error('Incorrect upgrade ordering');
          JS
          find work/source/app work/source/bootstrap -name '*.mjs' -type f -print0 | xargs -0 -n1 node --check
      - name: Run Node regression suite and deterministic build
        shell: bash
        run: |
          set -euo pipefail
          (cd work/source && node --test tests/*.test.mjs)
          python3 work/source/tools/build-release.py dist/GW2-Account-Companion-v5.9.0-rc.9-All-in-One.zip
          python3 work/source/tools/build-release.py dist/independent.zip
          cmp dist/GW2-Account-Companion-v5.9.0-rc.9-All-in-One.zip dist/independent.zip
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {inspectReleaseZip} from './work/source/app/install-verified.mjs';
          inspectReleaseZip(fs.readFileSync('dist/GW2-Account-Companion-v5.9.0-rc.9-All-in-One.zip'),{version:'5.9.0-rc.9'});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc9-preflight-source
          path: work/source/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc9-preflight-zip
          path: dist/GW2-Account-Companion-v5.9.0-rc.9-All-in-One.zip
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rc9-preflight-source
          path: source
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: PS5.1 parser and isolated status transition test
        shell: powershell
        run: |
          foreach($relative in @('bootstrap/Start-Managed.ps1','bootstrap/Update-Progress.ps1','launcher/GW2-Companion.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path (Join-Path source $relative)).Path,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw "PowerShell 5.1 syntax invalid: $relative"}
          }
          & ./.github/rc9-tray-test.ps1 -Launcher (Resolve-Path source/launcher/GW2-Companion.ps1).Path
          if(-not $?){exit 1}
      - name: Windows regression suite and atomic update status I/O
        shell: powershell
        run: |
          Push-Location source
          try {
            node --test tests/rc83-handoff.test.mjs tests/rollback-safety.test.mjs tests/v590-fixed-layout.test.mjs
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          }finally{Pop-Location}
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'gw2-rc9-test'
          node --input-type=module -e "import {atomicJSON,loadJSON} from './source/bootstrap/fixed-core.mjs';import path from 'node:path';const f=path.join(process.env.LOCALAPPDATA,'updater','status.json');for(let i=0;i<100;i++){atomicJSON(f,{i});if(loadJSON(f).i!==i)throw Error('Readback mismatch')}"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

# NO release, no signing and no update-feed change; production stays RC8.2.
