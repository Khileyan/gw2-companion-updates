name: Validate rollback safety fix (non-publishing)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'maintenance/rollback-safety/**'
      - '.github/workflows/test-rollback-safety.yml'

permissions:
  contents: read

concurrency:
  group: gw2-rollback-safety-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch and verify exact published RC7 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work dist
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/Khileyan/gw2-companion-updates/releases/download/v5.9.0-rc.7/GW2-Account-Companion-v5.9.0-rc.7-All-in-One.zip' -o work/rc7.zip
          echo 'c1271f6f1d7c008d5c72df6cfea7769536e4779f71e05d289a8fa0218581d642  work/rc7.zip' | sha256sum -c -
          (cd work && unzip -q rc7.zip && mv GW2-Account-Companion-v5.9.0-rc.7 source)
      - name: Apply reviewed RC8 overlay and enforce exact digest
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/rc8-overlay/patch.gz.b64 > work/rc8.patch.gz
          echo '07e763cd642306ccb428d85180c2246059ec8ec64ff1b30bdd01c7fc663d2c82  work/rc8.patch.gz' | sha256sum -c -
          gzip -dc work/rc8.patch.gz > work/rc8.patch
          echo '802d18416fb959b5630da743fa46b88af28faeb2fd4f5a410d938a55fec18eeb  work/rc8.patch' | sha256sum -c -
          (cd work/source && git init -q && git apply --check ../rc8.patch && git apply ../rc8.patch)
          cp .github/rc8-overlay/app-version.json work/source/app-version.json
          grep -F '"version": "5.9.0-rc.8"' work/source/app/package.json
          grep -F '"version": "5.9.0-rc.8"' work/source/app-version.json
          grep -F "export const VERSION = '5.9.0-rc.8'" work/source/app/engine.mjs
          grep -F "VERSION='5.9.0-rc.7'" work/source/tools/build-release.py
          sed -i "s/VERSION='5.9.0-rc.7'/VERSION='5.9.0-rc.8'/" work/source/tools/build-release.py
      - name: Adjust inherited RC7 test fixtures for RC8 version transitions
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          # Test fixtures are version-specific. Advance base and synthetic candidate
          # one RC each, keeping their relative order and rollback semantics intact.
          for filename in [
              'v581-crafting-handler.test.mjs',
              'v590-background-update-check.test.mjs',
              'v590-fixed-layout.test.mjs',
              'v590-managed-updater.test.mjs',
              'v590-rc7-status-regression.test.mjs',
          ]:
              path=Path('work/source/tests')/filename
              text=path.read_text()
              text=text.replace('5.9.0-rc.8', '__FUTURE_RC9__')
              text=text.replace('5.9.0-rc.7', '5.9.0-rc.8')
              text=text.replace('__FUTURE_RC9__', '5.9.0-rc.9')
              text=text.replace(r'5\.9\.0-rc\.7', r'5\.9\.0-rc\.8')
              text=text.replace(r"version='5\.9\.0-rc\.8';state", r'version=\$script:CompanionVersion;state')
              text=text.replace(r"pid=\$PID;version='5\.9\.0-rc\.8'", r'pid=\$PID;version=\$script:CompanionVersion')
              text=text.replace(r"\$PID\+' 5\.9\.0-rc\.8'", r"\$PID\+' '\+\$script:CompanionVersion")
              path.write_text(text)
          PYTHON
      - name: Apply proposed recovery fix and isolated regression tests
        shell: bash
        run: |
          set -euo pipefail
          cp maintenance/rollback-safety/rollback-safety.test.mjs work/source/tests/rollback-safety.test.mjs
          (cd work/source && git apply --check ../../maintenance/rollback-safety/rollback-safety.patch)
          (cd work/source && git apply ../../maintenance/rollback-safety/rollback-safety.patch)
      - name: Run full RC7+RC8 regression suite
        shell: bash
        run: |
          set -euo pipefail
          (cd work/source && node --test tests/*.test.mjs)
      - name: Verify all JS syntax and package reproducibility
        shell: bash
        run: |
          set -euo pipefail
          find work/source/app work/source/bootstrap -type f -name '*.mjs' -print0 | xargs -0 -n 1 node --check
          python3 work/source/tools/build-release.py dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip
          python3 work/source/tools/build-release.py dist/GW2-Account-Companion-v5.9.0-rc.8-independent.zip
          cmp dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip dist/GW2-Account-Companion-v5.9.0-rc.8-independent.zip
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {inspectReleaseZip} from './work/source/app/install-verified.mjs';
          const zip=fs.readFileSync('dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip');
          const records=inspectReleaseZip(zip,{version:'5.9.0-rc.8'}).records;
          if(!records.some(r=>r.parts.at(-1)==='publish-release.mjs'))throw Error('RC8 publisher missing from build');
          if(!records.some(r=>r.parts.at(-1)==='GW2-Companion.ps1'))throw Error('RC8 GUI missing');
          console.log('Verified RC8 release:',records.length,'entries');
          JS
          sha256sum dist/GW2-Account-Companion-v5.9.0-rc.8-All-in-One.zip

      - name: Upload tested source for Windows validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reviewed-rollback-source
          path: work/source/
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reviewed-rollback-source
          path: source
      - name: Verify Windows PowerShell 5.1 parses the launcher
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path source/bootstrap/Start-Managed.ps1).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Error $_.Message};exit 1}
          Write-Host 'PowerShell 5.1 syntax validated'
      - name: Run rollback safety regressions on Windows filesystem
        shell: pwsh
        run: |
          node --test source/tests/rollback-safety.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test source/tests/v590-fixed-layout.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test source/tests/v590-background-update-check.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# NON-PUBLISHING: no secrets, no GitHub releases, no preview.json updates.
